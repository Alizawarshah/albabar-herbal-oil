<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <meta name="description" content="البابر Herbal Oil: desi herbal hair oil slow-cooked from 20+ herbs. Free delivery and Cash on Delivery all over Pakistan." />
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Rozha+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="home">
<main id="main">
  <h1 class="sr-only" data-i18n="home.h1"></h1>

  <!-- HERO: one image or one video, no text on top.
       Change it in js/data.js → HERO (image 1920×800, or an .mp4 video). -->
  <section class="hero-media" id="heroMedia" aria-label="البابر Herbal Oil"></section>

  <!-- Promises -->
  <section class="promises" aria-label="Why order from us">
    <ul class="container promises__list">
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg><span><b data-i18n="trust.t3"></b><small data-i18n="trust.s3"></small></span></li>
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg><span><b data-i18n="trust.t2"></b><small data-i18n="trust.s2"></small></span></li>
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19c0-8 5-13 14-14-1 9-6 14-14 14z"/><path d="M5 19l7-7"/></svg><span><b data-i18n="trust.t1"></b><small data-i18n="trust.s1"></small></span></li>
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg><span><b data-i18n="trust.t5"></b><small data-i18n="trust.s5"></small></span></li>
    </ul>
  </section>

  <!-- Bundle deals -->
  <section class="block">
    <div class="container">
      <header class="block__head">
        <div><h2 data-i18n="deals.title"></h2><p data-i18n="deals.sub"></p></div>
        <a href="shop.html?c=bundles" class="text-link" data-i18n="deals.link"></a>
      </header>
      <div class="product-grid" id="dealsGrid"></div>
    </div>
  </section>

  <!-- Best sellers -->
  <section class="block">
    <div class="container">
      <header class="block__head">
        <div><h2 data-i18n="best.title"></h2><p data-i18n="best.sub"></p></div>
        <a href="shop.html?sort=best" class="text-link" data-i18n="best.link"></a>
      </header>
      <div class="product-grid" id="bestGrid"></div>
    </div>
  </section>

  <!-- How to use -->
  <section class="block block--paper">
    <div class="container">
      <header class="block__head"><div><h2 data-i18n="use.title"></h2></div></header>
      <ol class="steps">
        <li><span class="steps__n">1</span><h3 data-i18n="use.s1"></h3><p data-i18n="use.d1"></p></li>
        <li><span class="steps__n">2</span><h3 data-i18n="use.s2"></h3><p data-i18n="use.d2"></p></li>
        <li><span class="steps__n">3</span><h3 data-i18n="use.s3"></h3><p data-i18n="use.d3"></p></li>
      </ol>
    </div>
  </section>

  <!-- Customer photos -->
  <section class="block">
    <div class="container">
      <header class="block__head"><div><h2 data-i18n="gallery.title"></h2><p data-i18n="gallery.sub"></p></div></header>
      <div class="mosaic" id="galleryGrid"></div>
    </div>
  </section>

  <!-- Videos -->
  <section class="block block--paper">
    <div class="container">
      <header class="block__head">
        <div><h2 data-i18n="vid.title"></h2><p data-i18n="vid.sub"></p></div>
        <div class="arrows" dir="ltr">
          <button class="round-btn" data-act="vid-prev" aria-label="Previous videos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
          <button class="round-btn" data-act="vid-next" aria-label="Next videos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
        </div>
      </header>
      <div class="reel" id="vidTrack" dir="ltr"></div>
    </div>
  </section>

  <!-- How it's made -->
  <section class="block">
    <div class="container">
      <header class="block__head"><div><h2 data-i18n="proc.title"></h2><p data-i18n="proc.sub"></p></div></header>
      <ol class="process" id="processGrid"></ol>
    </div>
  </section>

  <!-- Before / after -->
  <section class="block block--paper">
    <div class="container">
      <header class="block__head"><div><h2 data-i18n="ba.title"></h2><p data-i18n="ba.sub"></p></div></header>
      <div class="ba-grid" id="baGrid"></div>
    </div>
  </section>

  <!-- Reviews -->
  <section class="block">
    <div class="container">
      <header class="block__head">
        <div><h2 data-i18n="rev.title"></h2><p><span class="stars" aria-hidden="true">★★★★★</span> <b>4.9</b> <span data-i18n="rev.based"></span></p></div>
      </header>
      <div class="quotes" id="reviewGrid"></div>
    </div>
  </section>

  <!-- FAQ -->
  <section class="block block--paper">
    <div class="container faq-wrap">
      <header class="block__head"><div><h2 data-i18n="faq.title"></h2></div></header>
      <div class="faq" id="faqList"></div>
    </div>
  </section>

  <!-- Closing -->
  <section class="closing">
    <div class="container closing__inner">
      <div><h2 data-i18n="cta.title"></h2><p data-i18n="cta.sub"></p></div>
      <div class="closing__btns">
        <a href="shop.html" class="btn btn--gold" data-i18n="cta.shop"></a>
        <a href="#" class="btn btn--wa js-wa" target="_blank" rel="noopener" data-i18n="wa.btn"></a>
      </div>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
