<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <meta name="description" content="Desi herbal hair oil slow-cooked from 20+ herbs. Choose your pack, pay cash on delivery, free delivery across Pakistan." />
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Rozha+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="product">
<main id="main">
  <div class="container">
    <nav class="breadcrumb"><a href="index.html" data-i18n="nav.home"></a> / <a href="shop.html" data-i18n="nav.all"></a> / <span id="pdCrumb"></span></nav>
    <div class="pd">
      <div class="pd__gallery">
        <div class="pd__main" id="pdMain"></div>
        <div class="pd__thumbs" id="pdThumbs"></div>
      </div>
      <div class="pd__info">
        <h1 class="pd__title" id="pdTitle"></h1>
        <div class="pd__rating"><span class="stars">★★★★★</span> <b>4.9</b> <span>(1,200+ <span data-i18n="pd.reviews"></span>)</span></div>
        <div class="pd__price"><s id="pdCompare"></s><b id="pdPrice"></b><span class="pill pill--gold" id="pdOff"></span></div>
        <p class="pd__shipnote" data-i18n="pd.shipnote"></p>
        <div class="chips"><span data-i18n="pd.chip1"></span><span data-i18n="pd.chip2"></span><span data-i18n="pd.chip3"></span><span data-i18n="pd.chip4"></span></div>
        <label class="field-label" data-i18n="pd.pack"></label>
        <div class="pack-options" id="packOptions"></div>
        <label class="field-label" data-i18n="pd.qty"></label>
        <div class="qty"><button type="button" data-q="-1">−</button><span id="pdQtyVal">1</span><button type="button" data-q="1">+</button></div>
        <p class="pd__stock"><span class="dot"></span><span data-i18n="pd.stock"></span></p>
        <button class="btn btn--outline btn--block" data-act="pd-add" data-i18n="pd.add"></button>
        <button class="btn btn--dark btn--block" data-act="pd-buy"><svg class="ic" viewBox="0 0 24 24"><path d="M5 7h14l-1.2 12.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"/><path d="M9 7V6a3 3 0 0 1 6 0v1"/></svg><span data-i18n="pd.cod"></span></button>
        <a class="btn btn--wa btn--block" id="pdWa" target="_blank" rel="noopener"><span data-i18n="pd.wa"></span></a>
        <div class="delivery-box">
          <p class="delivery-box__head"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><b id="pdEta"></b> <span data-i18n="pd.est"></span></p>
          <div class="timeline">
            <div class="timeline__step"><span class="timeline__dot"><svg viewBox="0 0 24 24"><path d="M4 8l8-4 8 4v8l-8 4-8-4z M4 8l8 4 8-4M12 12v8"/></svg></span><b data-i18n="pd.placed"></b><small id="tl1"></small></div>
            <div class="timeline__step"><span class="timeline__dot"><svg viewBox="0 0 24 24"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/></svg></span><b data-i18n="pd.dispatch"></b><small id="tl2"></small></div>
            <div class="timeline__step"><span class="timeline__dot"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9H3z M9 20v-6h6v6"/></svg></span><b data-i18n="pd.delivered"></b><small id="tl3"></small></div>
          </div>
        </div>
        <div class="accordion" id="pdAccordion"></div>
        <button class="share-btn" data-act="share"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3v13M7 8l5-5 5 5M5 14v6h14v-6"/></svg><span data-i18n="pd.share"></span></button>
      </div>
    </div>
  </div>

  <section class="block">
    <div class="container">
      <header class="block__head"><div><h2 data-i18n="rev.title"></h2><p><span class="stars" aria-hidden="true">★★★★★</span> <b>4.9</b> <span data-i18n="rev.based"></span></p></div></header>
      <div class="quotes" id="pdReviews"></div>
    </div>
  </section>

  <section class="block block--paper">
    <div class="container">
      <header class="block__head"><div><h2 data-i18n="pd.also"></h2></div><a href="shop.html" class="text-link" data-i18n="best.link"></a></header>
      <div class="product-grid" id="pdRelated"></div>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
