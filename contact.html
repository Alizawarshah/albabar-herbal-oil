<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact – البابر Herbal Oil</title>
  <meta name="description" content="Contact البابر Herbal Oil on WhatsApp or email, or send us a message." />
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Rozha+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="contact">
<main id="main">
  <div class="container">
    <nav class="breadcrumb"><a href="index.html" data-i18n="nav.home"></a> / <span data-i18n="nav.contact"></span></nav>
    <div class="page-head page-head--center"><h1 data-i18n="ct.title"></h1><p class="section__sub" data-i18n="ct.sub"></p></div>
    <div class="contact">
      <div class="contact__cards">
        <a class="info-card" id="ctWa" target="_blank" rel="noopener"><span class="info-card__ic info-card__ic--wa"><svg viewBox="0 0 24 24"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg></span><b data-i18n="ct.wa"></b><span id="ctWaText"></span></a>
        <a class="info-card" id="ctEmailLink"><span class="info-card__ic"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span><b data-i18n="ct.email"></b><span id="ctEmailText"></span></a>
        <div class="info-card"><span class="info-card__ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg></span><b data-i18n="ct.hours"></b><span data-i18n="foot.hours"></span></div>
      </div>
      <form class="contact__form" id="contactForm" novalidate>
        <div class="field-row">
          <div class="field"><label class="mini" for="ct1" data-i18n="ct.name"></label><input id="ct1" type="text" autocomplete="name" data-rule="name" data-err-key="err.name" /><small class="err"></small></div>
          <div class="field"><label class="mini" for="ct2" data-i18n="ct.emailf"></label><input id="ct2" type="email" autocomplete="email" data-rule="email" data-err-key="err.email" /><small class="err"></small></div>
        </div>
        <div class="field"><label class="mini" for="ct3" data-i18n="ct.phone"></label><input id="ct3" type="tel" autocomplete="tel" data-rule="phoneOpt" data-err-key="err.phone" /><small class="err"></small></div>
        <div class="field"><label class="mini" for="ct4" data-i18n="ct.msg"></label><textarea id="ct4" rows="5" data-rule="message" data-err-key="err.message"></textarea><small class="err"></small></div>
        <button type="submit" class="btn btn--green btn--lg" data-i18n="ct.send"></button>
        <p class="form-success" id="ctSent" data-i18n="ct.sent" hidden></p>
      </form>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
