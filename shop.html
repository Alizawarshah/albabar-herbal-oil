<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Products – البابر Herbal Oil</title>
  <meta name="description" content="All packs of البابر Herbal Oil: 100ml, 200ml, Duo and Family packs. Free delivery and Cash on Delivery in Pakistan." />
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Rozha+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="shop">
<main id="main">
  <div class="container">
    <nav class="breadcrumb"><a href="index.html" data-i18n="nav.home"></a> / <span id="crumbCol"></span></nav>
    <div class="page-head">
      <h1 id="colTitle"></h1>
      <p class="section__sub" id="colSub"></p>
    </div>
    <div class="toolbar">
      <div class="filters" id="filters">
        <span class="filters__label" data-i18n="col.filter"></span>
        <details class="filter" id="typeFilter"><summary data-i18n="col.type"></summary><div class="filter__body" id="fltTypes"></div></details>
        <details class="filter"><summary data-i18n="col.avail"></summary><div class="filter__body"><label class="check"><input type="checkbox" id="fltStock" /> <span data-i18n="col.instock"></span> <span id="instockCount"></span></label></div></details>
        <details class="filter"><summary data-i18n="col.price"></summary><div class="filter__body filter__price">
          <label>Rs <input type="number" id="fltMin" min="0" data-i18n-ph="col.from" /></label>
          <label>Rs <input type="number" id="fltMax" min="0" data-i18n-ph="col.to" /></label>
        </div></details>
        <button class="link-btn" id="clearFilters" data-act="clear-filters" data-i18n="col.clear" hidden></button>
      </div>
      <div class="sort">
        <label for="sortSel" data-i18n="col.sort"></label>
        <select id="sortSel"></select>
        <span class="muted" id="colCount"></span>
      </div>
    </div>
    <div class="product-grid product-grid--page" id="colGrid"></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
